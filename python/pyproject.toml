[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syncfit-contracts"
version = "1.0.0"
description = "Single source of truth for every interface between SyncFit Edge repositories."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
packages = ["syncfit_contracts"]

[tool.setuptools.package-data]
syncfit_contracts = ["py.typed"]
